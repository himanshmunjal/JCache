name: Release

# Push a tag such as v1.0.3 to build the jars, create a GitHub release,
# publish the Docker image and update the Homebrew tap.
#
# Secrets used:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  - Docker Hub account and access token
#                                          (Read, Write, Delete scope, needed to update the overview)
#   TAP_GITHUB_TOKEN                     - token with write access to the tap repository

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      server_sha: ${{ steps.sha.outputs.server }}
      client_sha: ${{ steps.sha.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          mvn -B --no-transfer-progress versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress verify
          cp cache-server/target/cache-server-${{ steps.version.outputs.version }}.jar jcache-server-${{ steps.version.outputs.version }}.jar
          cp cache-client/target/cache-client-${{ steps.version.outputs.version }}.jar jcache-client-${{ steps.version.outputs.version }}.jar

      - id: sha
        run: |
          echo "server=$(sha256sum jcache-server-*.jar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "client=$(sha256sum jcache-client-*.jar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            jcache-server-*.jar
            jcache-client-*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    runs-on: ubuntu-latest
    needs: jars
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/setup-qemu-action@v3
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/setup-buildx-action@v3
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        if: env.DOCKERHUB_TOKEN != ''
        with:
          images: himanshmunjal/jcache
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        if: env.DOCKERHUB_TOKEN != ''
        with:
          context: .
          file: distribution/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.jars.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
      - uses: peter-evans/dockerhub-description@v4
        if: env.DOCKERHUB_TOKEN != '' && !contains(github.ref_name, '-')
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: himanshmunjal/jcache
          short-description: In-memory cache server with LRU, LFU and ARC eviction, TTLs and persistence
          readme-filepath: distribution/DOCKERHUB.md

  homebrew:
    runs-on: ubuntu-latest
    needs: jars
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.TAP_GITHUB_TOKEN != ''
      - uses: actions/checkout@v4
        if: env.TAP_GITHUB_TOKEN != ''
        with:
          repository: himanshmunjal/homebrew-jcache
          token: ${{ env.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Update formula
        if: env.TAP_GITHUB_TOKEN != ''
        env:
          VERSION: ${{ needs.jars.outputs.version }}
          SERVER_SHA: ${{ needs.jars.outputs.server_sha }}
          CLIENT_SHA: ${{ needs.jars.outputs.client_sha }}
        run: |
          mkdir -p tap/Formula
          python3 - <<'PY'
          import os, re
          v, s, c = os.environ["VERSION"], os.environ["SERVER_SHA"], os.environ["CLIENT_SHA"]
          f = open("distribution/jcache.rb").read()
          f = re.sub(r"/v[^/]+/jcache-(server|client)-[^/\"]+\.jar", lambda m: f"/v{v}/jcache-{m[1]}-{v}.jar", f)
          shas = iter([s, c])
          f = re.sub(r'sha256 "[0-9a-f]{64}"', lambda m: f'sha256 "{next(shas)}"', f)
          open("tap/Formula/jcache.rb", "w").write(f)
          PY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/jcache.rb
          git commit -m "jcache ${VERSION}"
          git push
