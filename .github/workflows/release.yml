name: Release

# Triggered when you push a version tag: git tag v1.0.0 && git push origin v1.0.0
# This workflow:
#   1. Builds the fat JARs for server and client
#   2. Creates a GitHub Release
#   3. Uploads both JARs as release assets
#   4. Computes SHA256 of both JARs
#   5. Automatically updates the Homebrew formula in your tap repo
#      so users get the new version immediately after you push a tag

on:
  push:
    tags:
      - 'v*.*.*'          # matches v1.0.0, v1.2.3, v2.0.0-beta etc.

# Explicitly set permissions so GITHUB_TOKEN can create releases
# and push to the tap repository.
permissions:
  contents: write       # needed to create releases and upload assets

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build both fat JARs
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build JARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'           # Eclipse Temurin — most common in CI
          cache: 'maven'                    # cache ~/.m2 between runs (faster builds)

      # Extract the version number from the git tag.
      # Tag: v1.0.0  →  VERSION=1.0.0 (strips the leading 'v')
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Build everything. -DskipTests here because tests run in the CI workflow.
      # The release workflow only runs after tests pass (see `needs` below if
      # you split them — here we run tests as part of the build for simplicity).
      - name: Build all modules
        run: |
          mvn clean package \
            -DskipTests=false \
            --batch-mode \
            --no-transfer-progress \
            -Drevision=${{ steps.version.outputs.VERSION }}

      # Rename JARs to include the version number.
      # Maven shade plugin produces: cache-server/target/cache-server-1.0.0.jar
      # We rename to: jcache-server-1.0.0.jar for clarity in the release.
      - name: Rename JARs for release
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cp cache-server/target/cache-server-${VERSION}.jar \
             jcache-server-${VERSION}.jar
          cp cache-client/target/cache-client-${VERSION}.jar \
             jcache-client-${VERSION}.jar

      # Compute SHA256 for both JARs.
      # These values go into the Homebrew formula.
      - name: Compute SHA256
        id: sha256
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SERVER_SHA=$(shasum -a 256 jcache-server-${VERSION}.jar | awk '{print $1}')
          CLIENT_SHA=$(shasum -a 256 jcache-client-${VERSION}.jar | awk '{print $1}')
          echo "SERVER_SHA=${SERVER_SHA}" >> $GITHUB_OUTPUT
          echo "CLIENT_SHA=${CLIENT_SHA}" >> $GITHUB_OUTPUT
          echo "Server JAR SHA256: ${SERVER_SHA}"
          echo "Client JAR SHA256: ${CLIENT_SHA}"

      # Upload JARs as GitHub Actions artifacts so the release job can download them.
      - name: Upload JARs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jcache-jars
          path: |
            jcache-server-${{ steps.version.outputs.VERSION }}.jar
            jcache-client-${{ steps.version.outputs.VERSION }}.jar
          retention-days: 1

    # Expose outputs for use in downstream jobs
    outputs:
      version:    ${{ steps.version.outputs.VERSION }}
      server_sha: ${{ steps.sha256.outputs.SERVER_SHA }}
      client_sha: ${{ steps.sha256.outputs.CLIENT_SHA }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Create GitHub Release and upload JARs
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build                  # only runs after build job succeeds

    steps:
      - name: Download JARs from build job
        uses: actions/download-artifact@v4
        with:
          name: jcache-jars

      # Create the GitHub Release with both JARs attached.
      # The release notes are auto-generated from commits since the last tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "JCache ${{ needs.build.outputs.version }}"
          body: |
            ## JCache ${{ needs.build.outputs.version }}

            ### Install via Homebrew
            ```bash
            brew tap himanshmunjal/jcache
            brew install jcache
            ```

            ### Install manually
            ```bash
            # Start the server
            java -jar jcache-server-${{ needs.build.outputs.version }}.jar

            # Connect with the CLI
            java -jar jcache-client-${{ needs.build.outputs.version }}.jar
            ```

            ### SHA256 checksums
            ```
            ${{ needs.build.outputs.server_sha }}  jcache-server-${{ needs.build.outputs.version }}.jar
            ${{ needs.build.outputs.client_sha }}  jcache-client-${{ needs.build.outputs.version }}.jar
            ```

            ### Connect from any language
            Start the server on port 6379, then connect with a raw TCP socket:
            ```
            telnet localhost 6379
            PING
            +PONG
            PUT name Alice 3600
            +OK
            GET name
            +Alice
            ```

          files: |
            jcache-server-${{ needs.build.outputs.version }}.jar
            jcache-client-${{ needs.build.outputs.version }}.jar
          generate_release_notes: true     # appends commit history automatically
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.0.0-beta = prerelease

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Update the Homebrew tap formula automatically
  #
  # This job pushes an updated jcache.rb to your homebrew-jcache tap repo.
  # It replaces the url, sha256, and version fields with the new values.
  # Users who then run `brew update && brew upgrade jcache` get the new version.
  #
  # PREREQUISITE:
  #   Create a Personal Access Token (PAT) with `repo` scope.
  #   Add it as a repository secret named TAP_GITHUB_TOKEN.
  #   The default GITHUB_TOKEN cannot push to OTHER repositories.
  # ─────────────────────────────────────────────────────────────────────────
  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [build, release]       # only runs after both build and release succeed

    steps:
      - name: Checkout the tap repository
        uses: actions/checkout@v4
        with:
          repository: himanshmunjal/homebrew-jcache
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-jcache

      - name: Update formula with new version and SHA256
        run: |
          VERSION=${{ needs.build.outputs.version }}
          SERVER_SHA=${{ needs.build.outputs.server_sha }}
          CLIENT_SHA=${{ needs.build.outputs.client_sha }}
          FORMULA="homebrew-jcache/Formula/jcache.rb"

          # Replace the server JAR url line
          sed -i "s|releases/download/v.*/jcache-server-.*.jar|releases/download/v${VERSION}/jcache-server-${VERSION}.jar|g" "$FORMULA"

          # Replace the client JAR url line
          sed -i "s|releases/download/v.*/jcache-client-.*.jar|releases/download/v${VERSION}/jcache-client-${VERSION}.jar|g" "$FORMULA"

          # Replace the version line
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"

          # Replace the server SHA256 (first sha256 line in the file)
          # Using Python for reliable multi-line regex replacement
          python3 << PYEOF
          import re

          with open("$FORMULA", "r") as f:
              content = f.read()

          # Replace server sha256 (appears before the resource block)
          content = re.sub(
              r'(url ".*jcache-server.*"\n\s*)sha256 "[a-f0-9]+"',
              f'\\g<1>sha256 "${SERVER_SHA}"',
              content
          )

          # Replace client sha256 (appears inside resource "client" block)
          content = re.sub(
              r'(url ".*jcache-client.*"\n\s*)sha256 "[a-f0-9]+"',
              f'\\g<1>sha256 "${CLIENT_SHA}"',
              content
          )

          with open("$FORMULA", "w") as f:
              f.write(content)
          PYEOF

          echo "Updated formula:"
          grep -E "url|sha256|version" "$FORMULA"

      - name: Commit and push updated formula
        run: |
          cd homebrew-jcache
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/jcache.rb
          git commit -m "chore: update jcache to ${{ needs.build.outputs.version }}"
          git push