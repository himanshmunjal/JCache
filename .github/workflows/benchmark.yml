name: Benchmarks

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Build benchmark JAR
        run: mvn clean package -pl cache-benchmark -am -DskipTests

      - name: Run JMH benchmarks (quick mode for CI)
        run: |
          java -jar cache-benchmark/target/benchmarks.jar \
            -f 1 -wi 1 -i 3 \
            -rf json -rff benchmark-results.json \
            "LRUBenchmark|LFUBenchmark|PolicyComparison|ConcurrencyBenchmark"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json