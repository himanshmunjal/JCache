name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cache-core/**', 'cache-benchmark/**']

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B --no-transfer-progress package -pl cache-benchmark -am -DskipTests

      - name: Hit rates
        run: java -cp cache-benchmark/target/benchmarks.jar com.cache.bench.HitRateSimulation | tee hit-rates.txt

      - name: Throughput (short run)
        run: |
          java -jar cache-benchmark/target/benchmarks.jar "PolicyComparison|Concurrency" \
            -f 1 -wi 1 -i 3 -w 1s -r 1s -rf json -rff benchmark-results.json

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            hit-rates.txt
