## JCache Benchmark Pipeline
## ═══════════════════════════════════════════════════════════════════════════
##
## Runs JMH benchmarks on every push to main and on manual trigger.
## Produces JSON results, posts a summary table to GitHub Actions UI,
## and checks for performance regressions vs the last baseline.
##
## WHY SEPARATE FROM ci.yml?
##   Benchmarks are slow (5-10 min) and should not block PRs.
##   A slow benchmark does not mean broken code.
##   Running only on main gives a stable history for trend analysis.
