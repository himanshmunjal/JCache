name: Javadoc

# Publishes the API docs to GitHub Pages.
# Enable once under Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B --no-transfer-progress -DskipTests install javadoc:aggregate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs
      - id: deploy
        uses: actions/deploy-pages@v4
