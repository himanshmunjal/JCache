# Three independent JCache nodes for trying out ClusterCacheClient locally.
#
#   docker compose -f distribution/docker-compose.yml up -d --build
#   docker compose -f distribution/docker-compose.yml down        # keeps data
#   docker compose -f distribution/docker-compose.yml down -v     # deletes data
#
# Add Prometheus and a Grafana dashboard on http://localhost:3000:
#   docker compose -f distribution/docker-compose.yml --profile monitoring up -d

x-node: &node
  image: himanshmunjal/jcache:${JCACHE_VERSION:-latest}
  build:
    context: ..
    dockerfile: distribution/Dockerfile
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$$JCACHE_PORT && printf \"PING\\r\\n\" >&3 && read -r -t 2 r <&3 && [[ $$r == +PONG* ]]'"]
    interval: 10s
    timeout: 3s
    start_period: 10s
    retries: 3
  deploy:
    resources:
      limits:
        memory: 512M

x-env: &env
  JCACHE_POLICY: ${JCACHE_POLICY:-LRU}
  JCACHE_CAPACITY: ${JCACHE_CAPACITY:-10000}
  JCACHE_THREADS: ${JCACHE_THREADS:-8}
  JCACHE_MAX_CONNECTIONS: ${JCACHE_MAX_CONNECTIONS:-1000}
  JCACHE_PERSISTENCE_ENABLED: ${JCACHE_PERSISTENCE_ENABLED:-true}
  JCACHE_SNAPSHOT_INTERVAL_MS: ${JCACHE_SNAPSHOT_INTERVAL_MS:-300000}
  JCACHE_RATE_LIMIT: ${JCACHE_RATE_LIMIT:-0}
  JCACHE_RATE_LIMIT_BURST: ${JCACHE_RATE_LIMIT_BURST:-0}
  JCACHE_METRICS_PORT: 9100

services:
  jcache-1:
    <<: *node
    container_name: jcache-node-1
    environment:
      <<: *env
      JCACHE_PORT: 6379
    ports: ["6379:6379"]
    volumes: ["jcache-data-1:/data"]

  jcache-2:
    <<: *node
    container_name: jcache-node-2
    environment:
      <<: *env
      JCACHE_PORT: 6380
    ports: ["6380:6380"]
    volumes: ["jcache-data-2:/data"]

  jcache-3:
    <<: *node
    container_name: jcache-node-3
    environment:
      <<: *env
      JCACHE_PORT: 6381
    ports: ["6381:6381"]
    volumes: ["jcache-data-3:/data"]

  prometheus:
    image: prom/prometheus:v2.53.2
    profiles: [monitoring]
    restart: unless-stopped
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [jcache-1, jcache-2, jcache-3]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jcache.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  jcache-data-1:
  jcache-data-2:
  jcache-data-3:
